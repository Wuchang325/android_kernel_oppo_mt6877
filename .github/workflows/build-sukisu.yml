name: Build Reno7 SE 5G SukiSU Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup OPPO MTK environment
        shell: bash
        run: |
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_COMPAT=arm-linux-gnueabi-" >> "$GITHUB_ENV"

      - name: Build kernel with SukiSU-Ultra
        uses: dabao1955/kernel_build_action@v1.10.4
        with:
          kernel-url: ./

          config: k6877v1_64_k419_defconfig
          arch: arm64

          # OPPO MTK Android 13 kernel uses clang-r433403b
          aosp-clang: false
          other-clang-url: >-
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-s-v2-beta-2/clang-r433403b.tar.gz

          # GCC 4.9 binutils for old MTK 4.19 vendor kernel
          aosp-gcc: true

          # SukiSU-Ultra
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/SukiSU-Ultra/SukiSU-Ultra
          ksu-lkm: false

          # SukiSU/KPM config
          merge-configs: '["sukisu.config"]'

          ccache: true

          anykernel3: true
          release: false

      - name: Upload raw kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reno7-SE-5G-SukiSU-Kernel
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          if-no-files-found: warn
          path: |
            out/build.log
